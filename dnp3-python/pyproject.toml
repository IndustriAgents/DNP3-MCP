[project]
name = "industriagents-dnp3-mcp"
version = "0.3.0"
description = "Model Context Protocol server for DNP3 SCADA networks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IndustriAgents", email = "hi@industriagents.com" }]
dependencies = [
    "jsonschema>=4.23,<5",
    "anyio>=4.5",
    # Pure-Python DNP3 (IEEE 1815-2012) master and outstation. Pinned exactly:
    # dnp3_master.py relies on its internals (Master.process_response,
    # MasterTcpRunner._send_confirm, ResponseInfo.truncation) and works around
    # its CROB-encoding and confirm bugs. Re-run the opendnp3 interop tests
    # (tests/interop) before changing it.
    "dnp3py==0.6.0",
    # mcp 2.x renamed FastMCP and changed its API; this server targets 1.x.
    # Contract wire errors require CallToolResult passthrough (tested on 1.22+).
    "mcp[cli]>=1.22.0,<2",
    # The supported MCP 1.x floor uses typing helpers removed in Pydantic 2.13.
    "pydantic>=2.11.0,<2.13",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]
# opendnp3 (the yadnp3 bindings) as an independent reference outstation and
# master for tests/interop. Wheels exist only for Linux x86_64 and Windows.
interop = [
    "yadnp3==3.2.1.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
dnp3-mcp = "dnp3_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/dnp3_mcp"]
