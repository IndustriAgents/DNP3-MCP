name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: MCP server (dnp3-python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dnp3-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q src

      - name: Import package and build the server
        run: uv run --locked python -c "from dnp3_mcp import DNP3MCPServer; DNP3MCPServer()"

      # Starts the `dnp3-mcp` console script and talks MCP to it over stdio.
      # The DNP3 master is still a scaffold that opens no connection, so this
      # needs no outstation. Revisit once the master connects at startup.
      - name: MCP handshake (initialize, tools/list, ping)
        run: |
          uv run --locked python - <<'PY'
          import json
          import shutil

          import anyio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          EXPECTED = {
              "read_binary_inputs", "read_analog_inputs", "write_binary_output",
              "poll_class", "list_points", "read_point_by_alias",
              "write_point_by_alias", "ping",
          }

          async def main() -> None:
              params = StdioServerParameters(
                  command=shutil.which("dnp3-mcp"),
                  env={"DNP3_WRITES_ENABLED": "false"},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      init = await session.initialize()
                      print("server:", init.serverInfo.name)
                      names = {t.name for t in (await session.list_tools()).tools}
                      print("tools:", sorted(names))
                      missing = EXPECTED - names
                      assert not missing, f"tools missing from tools/list: {sorted(missing)}"
                      result = await session.call_tool("ping", {})
                      envelope = json.loads(result.content[0].text)
                      print("ping:", envelope)
                      assert envelope["success"] is True, envelope
                      assert envelope["data"]["writes_enabled"] is False, envelope

          anyio.run(main)
          PY

  mock:
    name: Mock outstation (dnp3-mock-outstation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dnp3-mock-outstation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q dnp3_mock_outstation.py

      - name: Entry point help
        run: uv run --locked dnp3-mock-outstation --help
