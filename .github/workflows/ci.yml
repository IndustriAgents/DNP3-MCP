name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: MCP server (dnp3-python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dnp3-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format check (ruff format)
        run: uv run --locked ruff format --check .

      # Includes the end-to-end tests: they start ../dnp3-mock-outstation (a
      # real DNP3 outstation) and drive the `dnp3-mcp` console script over
      # stdio with the MCP client SDK.
      - name: Tests (pytest)
        run: uv run --locked pytest

  mock:
    name: Mock outstation (dnp3-mock-outstation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dnp3-mock-outstation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format check (ruff format)
        run: uv run --locked ruff format --check .

      - name: Tests (pytest)
        run: uv run --locked pytest

      - name: Entry point help
        run: uv run --locked dnp3-mock-outstation --help
