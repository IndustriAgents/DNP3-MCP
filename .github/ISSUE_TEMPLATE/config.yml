blank_issues_enabled: false
contact_links:
  - name: Question or usage help
    url: https://github.com/IndustriAgents/DNP3-MCP/discussions
    about: Ask about configuration, MCP clients, or connecting to your own outstation.
  - name: Model Context Protocol docs
    url: https://modelcontextprotocol.io
    about: Reference for MCP itself — transports, clients, and the tool interface.
  - name: Security vulnerability
    url: https://github.com/IndustriAgents/DNP3-MCP/security/policy
    about: Report privately. Please do not open a public issue.
  - name: mcp-manager-ui or suite-wide issues
    url: https://github.com/IndustriAgents/IndustriConnect/issues
    about: Issues with mcp-manager-ui, the suite as a whole or another protocol server belong in IndustriConnect, unless that server already has its own IndustriAgents/<Protocol>-MCP repository.
